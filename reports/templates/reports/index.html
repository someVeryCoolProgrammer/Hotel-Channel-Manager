<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/home-page.css' %}">
</head>

<body>
    <div class="home-page">
        <div class="heading"> 
            <h1>Tracking your hotels income and expenses made easy.</h1>
        </div>
    
        <div class="login-container">
            <button class="login">Log In</button>
        </div>

        <div class="user-email-container">
            <form method="POST">
                <label for="email"> 
                <input class="user-input" type="email" placeholder="you@domain.com">
            </form>
            <div class="user-email-button-container">
                <button class="user-email-button" type="submit">Submit</button>
            </div>  
        </div>

        <div class="nav">
            <h2>Quick Links</h2>
            <nav>
                <a class=source-code href="https://github.com/someVeryCoolProgrammer/Hotel-Channel-Manager/tree/main">Source Code</a>
            </nav>
        </div>
    
        <div class=legal>
            <footer>
                Copyright someVeryCoolProgrammer &copy; 2026 - Present. All rights reserved.
            </footer>
        </div>
    </div>
</body>
</html>
